name: Set update time zone

# The site's location banner opens a prefilled issue "Set update time zone: <IANA zone>".
# Only the repo owner's issues count. This stores the zone, moves the daily update to
# 12:00 noon there, and runs an update now if today's noon there has already passed
# without one.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  set:
    if: startsWith(github.event.issue.title, 'Set update time zone:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Move the daily update
        env:
          TITLE: ${{ github.event.issue.title }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
        run: |
          tz=$(printf '%s' "${TITLE#Set update time zone:}" | tr -d '[:space:]')
          if ! python3 scripts/schedule.py valid "$tz"; then
            gh issue close "$ISSUE" -R "$REPO" -c "\"$tz\" isn't a time zone I know, so the update time was not changed."
            exit 0
          fi
          if [ -z "$SCHEDULE_TOKEN" ]; then
            gh issue close "$ISSUE" -R "$REPO" -c "The SCHEDULE_TOKEN secret is missing, so the update time can't be changed yet."
            exit 0
          fi
          cron=$(python3 scripts/schedule.py cron "$tz")
          GH_TOKEN="$SCHEDULE_TOKEN" gh variable set UPDATE_TZ -R "$REPO" -b "$tz"
          GH_TOKEN="$SCHEDULE_TOKEN" gh variable set UPDATE_CRON -R "$REPO" -b "$cron"
          msg="Done: the site now updates every day at 12:00 noon $tz time."
          curl -fsS https://plan-my-day-discover.web.app/data/meta.json -o meta.json || echo '{}' > meta.json
          if [ "$(python3 scripts/schedule.py due "$tz" meta.json)" = yes ]; then
            gh workflow run refresh.yml -R "$REPO"
            msg="$msg Today's 12:00 there has passed without an update, so one is running now (ready in about 30 minutes)."
          fi
          gh issue close "$ISSUE" -R "$REPO" -c "$msg"
