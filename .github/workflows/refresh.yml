name: Daily refresh

on:
  # One trigger per hour; the job below runs only on the one that is 12:00 noon in the owner's
  # time zone (repo variable UPDATE_CRON, set by timezone.yml from the site's location banner).
  # The other 23 are skipped before a runner starts, so they use no Actions minutes.
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      sections:
        description: "Sections to refresh (blank = all): news movies games music sports"
        required: false
        default: ""

permissions:
  contents: write              # push the state branch (caches, history, last valid data)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'schedule' || github.event.schedule == (vars.UPDATE_CRON || '0 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (caches, history, last valid datasets)
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth 1 origin state
            mkdir -p state
            git archive FETCH_HEAD | tar -x -C state
          else
            echo "No state branch yet (first run)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build datasets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          UPDATE_TZ: ${{ vars.UPDATE_TZ || 'Asia/Kuwait' }}
        run: python -m pipeline ${{ github.event.inputs.sections }}

      - name: Save state branch
        if: always()
        run: |
          [ -d state ] || exit 0
          cd state
          git init -q -b state
          git config user.name "discover-bot"
          git config user.email "discover-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state

      - name: Deploy to Firebase Hosting (discovery site only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # firebase.json pins hosting to site "plan-my-day-discover"; nothing else is deployed
          npx --yes firebase-tools@14 deploy --only hosting --project plan-my-day-4ba6b --non-interactive \
            -m "daily refresh ${{ github.run_id }}"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Keep the update at 12:00 local (daylight-saving changes)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
          UPDATE_TZ: ${{ vars.UPDATE_TZ || 'Asia/Kuwait' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "No SCHEDULE_TOKEN secret; schedule unchanged"; exit 0; }
          cron=$(python scripts/schedule.py cron "$UPDATE_TZ" --tomorrow)
          [ "$cron" = "${{ vars.UPDATE_CRON }}" ] || gh variable set UPDATE_CRON -R "${{ github.repository }}" -b "$cron"

      - name: Run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              meta = json.load(open("state/last/meta.json"))
          except Exception as e:
              meta = {"error": str(e)}
          lines = ["| Section | OK | Updated | Items | Error |", "|---|---|---|---|---|"]
          for s, m in (meta.get("sections") or {}).items():
              lines.append(f"| {s} | {'✅' if m.get('ok') else '❌'} | {m.get('updated_at')} | {m.get('items')} | {m.get('error') or ''} |")
          ai = (meta.get("run") or {}).get("ai") or {}
          lines.append(f"\nAI: {ai.get('spent_usd')} of {ai.get('cap_usd')} USD this month; active={ai.get('active')} {ai.get('note') or ''}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY
